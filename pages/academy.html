<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Academy — WebBook SaaS</title>
<meta name="description" content="Free 30-minute courses for authors who want to ship great WebBooks." />
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class',theme:{extend:{colors:{violet:{500:'#8b5cf6',600:'#7c3aed'},rose:{500:'#f43f5e'},amber:{500:'#f59e0b'}},fontFamily:{sans:['Inter','sans-serif'],display:['"Fraunces"','"Space Grotesk"','serif']}}}}</script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="../css/style.css">
</head>
<body data-prefix="../" class="bg-amber-50/30 dark:bg-[#0a0613] text-slate-800 dark:text-slate-200 antialiased font-sans">
<div data-shell></div>

<section class="pt-32 pb-12 relative overflow-hidden">
  <div class="absolute inset-0 wb-grid-bg"></div>
  <div class="wb-orb wb-orb-3 w-[420px] h-[420px] -top-20 -left-20"></div>
  <div class="relative max-w-4xl mx-auto px-4 sm:px-6 text-center" data-rv>
    <span class="wb-chip">Academy</span>
    <h1 class="mt-5 font-display font-black text-4xl sm:text-6xl text-slate-900 dark:text-white">Free <span class="wb-gradient-text">30-minute</span> courses.</h1>
    <p class="mt-5 text-lg text-slate-600 dark:text-slate-300">Bite-sized lessons from authors who shipped WebBooks read by hundreds of thousands.</p>
  </div>
</section>

<section class="pb-16">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 grid sm:grid-cols-2 lg:grid-cols-3 gap-5">
    ${[1,2,3,4,5,6]}
  </div>
</section>

<script>
  // Render courses dynamically to keep page light
  document.addEventListener('DOMContentLoaded', () => {
    const courses = [
      { t:'WebBook 101', d:'From idea to live URL in one session.', m:'30 min', i:'rocket' },
      { t:'Tone in translation', d:'Keep your voice across 40 languages.', m:'25 min', i:'languages' },
      { t:'Train your AI companion', d:'Five examples that change everything.', m:'20 min', i:'bot' },
      { t:'Reader analytics 101', d:'What the numbers actually mean.', m:'30 min', i:'bar-chart-3' },
      { t:'Monetize without alienating readers', d:'Paywalls done right.', m:'35 min', i:'wallet' },
      { t:'Building a reader community', d:'From silence to book club.', m:'30 min', i:'users' }
    ];
    const host = document.querySelector('section.pb-16 .grid');
    if (host) host.innerHTML = courses.map((c,i) => `
      <a href="#" class="wb-glass rounded-2xl p-5 wb-lift block" data-wb-anim data-rv-delay="${i % 3}">
        <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-violet-600 to-rose-500 text-white flex items-center justify-center"><i data-lucide="${c.i}" class="w-5 h-5"></i></div>
        <h3 class="font-display font-bold mt-3 text-slate-900 dark:text-white">${c.t}</h3>
        <p class="text-sm text-slate-600 dark:text-slate-300 mt-1.5">${c.d}</p>
        <p class="text-xs text-slate-500 mt-3">${c.m} · free</p>
      </a>
    `).join('');
    const wbIO = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); wbIO.unobserve(e.target); }}), { threshold:0.1 });
    host?.querySelectorAll('[data-wb-anim]').forEach(el => wbIO.observe(el));
    if (window.lucide) lucide.createIcons();
  });
</script>

<div data-shell-foot></div>
<script src="../js/logos.js"></script><script src="../js/megamenu.js"></script><script src="../js/shell.js"></script><script src="../js/main.js"></script><script src="../js/api.js"></script>
</body>
</html>

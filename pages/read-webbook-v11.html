<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Read a WebBook · v11 Focus — WebBook SaaS</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  :root{--rb-bg:#f7f7f5;--rb-ink:#1a1a1a;--rb-line:#e5e5e3;--rb-accent:#0f766e}
  html,body{background:var(--rb-bg);color:var(--rb-ink);min-height:100vh;font-family:Inter,sans-serif}
  .v11-shell{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
  .v11-aside{position:fixed;top:0;bottom:0;left:0;width:260px;border-right:1px solid var(--rb-line);background:#fff;display:flex;flex-direction:column;z-index:30}
  .v11-main{margin-left:260px;display:flex;flex-direction:column;min-height:100vh}
  .v11-frame-wrap{flex:1;position:relative;background:#fff;max-width:980px;margin:0 auto;width:100%;border-left:1px solid var(--rb-line);border-right:1px solid var(--rb-line)}
  .v11-frame{width:100%;height:100%;border:0;display:block}
  .v11-toc{display:flex;align-items:center;gap:.55rem;padding:.5rem .65rem;border-radius:.35rem;font-size:.8rem;color:#525252;transition:all .15s}
  .v11-toc:hover{background:#f0fdfa;color:var(--rb-accent)}
  .v11-toc[aria-current="true"]{background:#ccfbf1;color:var(--rb-accent);font-weight:600}
  .v11-dot{width:6px;height:6px;border-radius:50%;background:#d4d4d4;flex-shrink:0}
  .v11-toc[aria-current="true"] .v11-dot{background:var(--rb-accent)}
  .v11-iconbtn{width:32px;height:32px;border-radius:.35rem;display:inline-flex;align-items:center;justify-content:center;color:#525252;transition:background .15s}
  .v11-iconbtn:hover{background:#f0fdfa;color:var(--rb-accent)}
  .v11-load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#fff;transition:opacity .4s}
  .v11-load.hide{opacity:0;pointer-events:none}
  .v11-pulse{width:14px;height:14px;border-radius:50%;background:var(--rb-accent);animation:v11p 1.4s ease-in-out infinite}
  @keyframes v11p{0%,100%{transform:scale(.7);opacity:.5}50%{transform:scale(1.2);opacity:1}}
  .v11-timer{font-variant-numeric:tabular-nums;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:.78rem;color:var(--rb-accent);font-weight:600}
  @media(max-width:900px){.v11-shell{grid-template-columns:1fr}.v11-aside{transform:translateX(-100%);transition:transform .3s}.v11-aside.is-open{transform:translateX(0)}.v11-main{margin-left:0}.v11-tog{display:inline-flex!important}}
  .v11-tog{display:none}
</style>
</head>
<body>
<button class="v11-tog v11-iconbtn fixed top-3 left-3 z-40 bg-white border border-gray-200 shadow-sm" id="v11Tog"><i data-lucide="menu" class="w-4 h-4"></i></button>

<div class="v11-shell">
  <aside class="v11-aside" id="v11Aside">
    <div class="px-4 py-3 border-b" style="border-color:var(--rb-line)">
      <a href="../index.html" class="flex items-center gap-2">
        <span class="w-7 h-7 rounded bg-teal-700 flex items-center justify-center"><i data-lucide="target" class="w-4 h-4 text-white"></i></span>
        <span class="font-semibold text-sm">Focus<span class="block text-[9px] tracking-widest uppercase opacity-50">v11 reader</span></span>
      </a>
    </div>
    <div class="flex-1 overflow-y-auto px-3 py-3 space-y-4">
      <section>
        <p class="text-[10px] uppercase tracking-widest opacity-50 font-semibold px-2 mb-1">Session</p>
        <div class="px-2 py-3 rounded bg-teal-50 border border-teal-100 flex items-center justify-between">
          <div><span class="v11-timer">25:00</span><p class="text-[10px] opacity-60 mt-0.5">Pomodoro</p></div>
          <button class="v11-iconbtn" title="Start"><i data-lucide="play" class="w-4 h-4"></i></button>
        </div>
      </section>
      <section>
        <p class="text-[10px] uppercase tracking-widest opacity-50 font-semibold px-2 mb-1">Today's chapter</p>
        <div class="px-2"><h2 class="font-semibold text-sm leading-snug">What the model would not say</h2><p class="text-[11px] opacity-60 mt-0.5">~ 18 min · 2,400 words</p></div>
      </section>
      <section>
        <p class="text-[10px] uppercase tracking-widest opacity-50 font-semibold px-2 mb-1">Index</p>
        <div class="space-y-0.5">
          <a class="v11-toc" href="#"><span class="v11-dot"></span> 01. A whisper in the data</a>
          <a class="v11-toc" href="#"><span class="v11-dot"></span> 02. The garden of choices</a>
          <a class="v11-toc" href="#" aria-current="true"><span class="v11-dot"></span> 03. What the model would not say</a>
          <a class="v11-toc" href="#"><span class="v11-dot"></span> 04. Two algorithms</a>
          <a class="v11-toc" href="#"><span class="v11-dot"></span> 05. The interview</a>
        </div>
      </section>
      <section>
        <p class="text-[10px] uppercase tracking-widest opacity-50 font-semibold px-2 mb-1">Distraction-free</p>
        <label class="flex items-center justify-between px-2 py-1.5 text-xs"><span>Hide companion</span><input type="checkbox" class="accent-teal-700"></label>
        <label class="flex items-center justify-between px-2 py-1.5 text-xs"><span>Mute sounds</span><input type="checkbox" class="accent-teal-700"></label>
        <label class="flex items-center justify-between px-2 py-1.5 text-xs"><span>Single column</span><input type="checkbox" class="accent-teal-700" checked></label>
      </section>
    </div>
    <div class="px-3 py-2.5 border-t flex items-center gap-1" style="border-color:var(--rb-line)">
      <button class="v11-iconbtn" title="Notes"><i data-lucide="pen-tool" class="w-4 h-4"></i></button>
      <button class="v11-iconbtn" title="Bookmark"><i data-lucide="bookmark" class="w-4 h-4"></i></button>
      <button class="v11-iconbtn ml-auto" title="Quiet AI"><i data-lucide="bell-off" class="w-4 h-4"></i></button>
    </div>
  </aside>

  <main class="v11-main">
    <header class="flex items-center justify-between px-5 py-2 border-b bg-white" style="border-color:var(--rb-line)">
      <p class="text-xs opacity-60">Reading · 24% · ~14 min remaining</p>
      <div class="flex items-center gap-1">
        <a href="read-webbook.html" class="v11-iconbtn" title="v6"><i data-lucide="layout" class="w-4 h-4"></i></a>
        <a href="read-webbook-v7.html" class="v11-iconbtn" title="v7"><i data-lucide="minus" class="w-4 h-4"></i></a>
        <a href="read-webbook-v8.html" class="v11-iconbtn" title="v8"><i data-lucide="maximize-2" class="w-4 h-4"></i></a>
        <a href="read-webbook-v9.html" class="v11-iconbtn" title="v9"><i data-lucide="graduation-cap" class="w-4 h-4"></i></a>
        <a href="read-webbook-v10.html" class="v11-iconbtn" title="v10"><i data-lucide="film" class="w-4 h-4"></i></a>
      </div>
    </header>
    <div class="v11-frame-wrap">
      <div class="v11-load" id="v11Load"><div class="v11-pulse"></div></div>
      <iframe class="v11-frame" id="v11Frame" src="https://2030b.com/webbook/webbook-v6.html" title="WebBook reader" loading="lazy" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
    </div>
  </main>
</div>
<script>
  lucide.createIcons();
  document.getElementById('v11Tog').addEventListener('click',()=>document.getElementById('v11Aside').classList.toggle('is-open'));
  const f=document.getElementById('v11Frame'),l=document.getElementById('v11Load');
  f.addEventListener('load',()=>setTimeout(()=>l.classList.add('hide'),250));setTimeout(()=>l.classList.add('hide'),4500);
</script>
</body>
</html>

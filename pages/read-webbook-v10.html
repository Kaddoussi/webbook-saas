<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Read a WebBook · v10 Cinematic — WebBook SaaS</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  html,body{background:#000;color:#f4f1ff;min-height:100vh;font-family:Inter,sans-serif;overflow:hidden}
  .v10-shell{position:relative;width:100vw;height:100vh}
  .v10-aside{position:fixed;top:0;bottom:0;left:0;width:300px;background:#000;border-right:1px solid rgba(244,63,94,.18);display:flex;flex-direction:column;z-index:20}
  .v10-main{position:fixed;top:0;bottom:0;left:300px;right:0;z-index:10;display:flex;flex-direction:column}
  .v10-frame-wrap{flex:1;position:relative;background:#000}
  .v10-frame{width:100%;height:100%;border:0;display:block;background:#000}
  .v10-letter{position:absolute;left:0;right:0;height:48px;background:#000;z-index:11;pointer-events:none}
  .v10-letter.top{top:0}.v10-letter.bot{bottom:0}
  .v10-toc{display:flex;align-items:start;gap:.7rem;padding:.65rem .85rem;border-radius:.45rem;font-size:.83rem;color:rgba(244,241,255,.65);transition:all .2s}
  .v10-toc:hover{background:rgba(244,63,94,.08);color:#fff}
  .v10-toc[aria-current="true"]{background:linear-gradient(90deg,rgba(244,63,94,.18),transparent);color:#fff;font-weight:600;border-left:2px solid #f43f5e;padding-left:calc(.85rem - 2px)}
  .v10-num{width:24px;height:24px;border-radius:50%;background:rgba(244,63,94,.15);display:inline-flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:700;color:#fda4af;flex-shrink:0;font-family:Fraunces,serif}
  .v10-iconbtn{width:36px;height:36px;border-radius:.45rem;display:inline-flex;align-items:center;justify-content:center;color:#fda4af;background:rgba(244,63,94,.08);border:1px solid rgba(244,63,94,.18);transition:all .2s}
  .v10-iconbtn:hover{background:rgba(244,63,94,.18);color:#fff}
  .v10-load{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;gap:1rem;transition:opacity .8s}
  .v10-load.hide{opacity:0;pointer-events:none}
  .v10-title{font-family:Fraunces,serif;font-weight:900;font-size:2.5rem;letter-spacing:-.02em;background:linear-gradient(90deg,#f43f5e,#fda4af,#f43f5e);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:v10g 3s linear infinite}
  @keyframes v10g{to{background-position:-200% 0}}
  .v10-grain{position:absolute;inset:0;pointer-events:none;opacity:.04;background-image:repeating-radial-gradient(circle at 7% 13%,#fff 0,#fff .5px,transparent .5px,transparent 4px),repeating-radial-gradient(circle at 79% 41%,#fff 0,#fff .5px,transparent .5px,transparent 4px);mix-blend-mode:overlay;z-index:12}
  @media(max-width:900px){.v10-aside{transform:translateX(-100%);transition:transform .3s;width:min(280px,82vw)}.v10-aside.is-open{transform:translateX(0)}.v10-main{left:0}.v10-tog{display:inline-flex!important}}
  .v10-tog{display:none}
</style>
</head>
<body>
<button class="v10-tog v10-iconbtn fixed top-3 left-3 z-40" id="v10Tog"><i data-lucide="menu" class="w-4 h-4"></i></button>
<div class="v10-shell">

  <aside class="v10-aside" id="v10Aside">
    <div class="px-5 py-5 border-b border-rose-500/15">
      <a href="../index.html" class="flex items-center gap-2.5">
        <span class="w-9 h-9 rounded-md bg-gradient-to-br from-rose-500 to-amber-500 flex items-center justify-center"><i data-lucide="film" class="w-4 h-4 text-white"></i></span>
        <span class="font-display font-bold leading-none">Cinematic<span class="block text-[9px] tracking-[.22em] uppercase opacity-60 mt-0.5">v10</span></span>
      </a>
    </div>
    <div class="flex-1 overflow-y-auto px-3 py-4 space-y-5">
      <section class="px-2">
        <p class="text-[10px] uppercase tracking-[.18em] text-rose-300/70 font-semibold">Featuring</p>
        <h2 class="font-display font-bold text-2xl mt-1.5" style="line-height:1.05">The Quiet<br>Algorithm</h2>
        <p class="text-xs text-rose-200/55 mt-2 italic" style="font-family:Fraunces,serif">a novel by Lina Aldridge</p>
        <div class="mt-3 flex items-center gap-1 text-[10px] text-rose-200/55"><span>★★★★★</span><span>·</span><span>4.8</span></div>
      </section>
      <section>
        <p class="text-[10px] uppercase tracking-[.18em] text-rose-300/60 font-semibold mb-2 px-2">Scenes</p>
        <div class="space-y-0.5">
          <a class="v10-toc" href="#"><span class="v10-num">I</span><span>A whisper in the data</span></a>
          <a class="v10-toc" href="#"><span class="v10-num">II</span><span>The garden of choices</span></a>
          <a class="v10-toc" href="#" aria-current="true"><span class="v10-num">III</span><span>What the model would not say</span></a>
          <a class="v10-toc" href="#"><span class="v10-num">IV</span><span>Two algorithms</span></a>
          <a class="v10-toc" href="#"><span class="v10-num">V</span><span>The interview</span></a>
        </div>
      </section>
    </div>
    <div class="px-4 py-3 border-t border-rose-500/15 flex items-center gap-1">
      <button class="v10-iconbtn" title="Listen"><i data-lucide="volume-2" class="w-4 h-4"></i></button>
      <button class="v10-iconbtn" title="Soundtrack"><i data-lucide="music" class="w-4 h-4"></i></button>
      <button class="v10-iconbtn" title="Subtitles"><i data-lucide="captions" class="w-4 h-4"></i></button>
      <a href="../index.html" class="v10-iconbtn ml-auto" title="Exit"><i data-lucide="x" class="w-4 h-4"></i></a>
    </div>
  </aside>

  <main class="v10-main">
    <div class="flex items-center justify-between px-5 py-3 border-b border-rose-500/10">
      <p class="text-xs text-rose-200/55" style="font-family:Fraunces,serif;letter-spacing:.18em;text-transform:uppercase">Scene III · 24%</p>
      <div class="flex items-center gap-1.5">
        <a href="read-webbook.html" class="v10-iconbtn" title="v6"><i data-lucide="layout" class="w-4 h-4"></i></a>
        <a href="read-webbook-v7.html" class="v10-iconbtn" title="v7"><i data-lucide="minus" class="w-4 h-4"></i></a>
        <a href="read-webbook-v8.html" class="v10-iconbtn" title="v8"><i data-lucide="maximize-2" class="w-4 h-4"></i></a>
        <a href="read-webbook-v9.html" class="v10-iconbtn" title="v9"><i data-lucide="graduation-cap" class="w-4 h-4"></i></a>
        <a href="read-webbook-v11.html" class="v10-iconbtn" title="v11"><i data-lucide="target" class="w-4 h-4"></i></a>
      </div>
    </div>
    <div class="v10-frame-wrap">
      <div class="v10-letter top"></div><div class="v10-letter bot"></div>
      <div class="v10-grain"></div>
      <div class="v10-load" id="v10Load"><div class="v10-title">PRESENTING…</div><p class="text-xs tracking-[.3em] uppercase opacity-60">a 2030B WebBook</p></div>
      <iframe class="v10-frame" id="v10Frame" src="https://2030b.com/webbook/webbook-v6.html" title="WebBook reader" loading="lazy" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
    </div>
  </main>
</div>
<script>
  lucide.createIcons();
  document.getElementById('v10Tog').addEventListener('click',()=>document.getElementById('v10Aside').classList.toggle('is-open'));
  const f=document.getElementById('v10Frame'),l=document.getElementById('v10Load');
  f.addEventListener('load',()=>setTimeout(()=>l.classList.add('hide'),700));setTimeout(()=>l.classList.add('hide'),5000);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Library — WebBook SaaS</title>
<meta name="description" content="Browse a small library of free WebBooks across fiction, non-fiction, education, and indie voices." />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { darkMode:'class', theme:{ extend:{
    colors:{ violet:{500:'#8b5cf6',600:'#7c3aed'}, rose:{500:'#f43f5e'}, amber:{500:'#f59e0b'} },
    fontFamily:{ sans:['Inter','sans-serif'], display:['"Fraunces"','"Space Grotesk"','serif'] } }}}
</script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="../css/style.css">
</head>
<body data-prefix="../" class="bg-amber-50/30 dark:bg-[#0a0613] text-slate-800 dark:text-slate-200 antialiased font-sans">

<div data-shell></div>

<section class="pt-32 pb-12 relative overflow-hidden">
  <div class="absolute inset-0 wb-grid-bg"></div>
  <div class="wb-orb wb-orb-1 w-[420px] h-[420px] -top-20 -left-20"></div>
  <div class="relative max-w-4xl mx-auto px-4 sm:px-6 text-center" data-rv>
    <span class="wb-chip">Library</span>
    <h1 class="mt-5 font-display font-black text-4xl sm:text-6xl text-slate-900 dark:text-white">Sample <span class="wb-gradient-text">WebBooks</span>.</h1>
    <p class="mt-5 text-lg text-slate-600 dark:text-slate-300">A small, curated shelf. Free to read. Listen, ask, switch languages.</p>
  </div>
</section>

<section class="pb-16">
  <div class="max-w-7xl mx-auto px-4 sm:px-6">
    <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-6" id="wb-library">
      <!-- 8 sample webbooks -->
    </div>
  </div>
</section>

<div data-shell-foot></div>
<script src="../js/logos.js"></script>
<script src="../js/megamenu.js"></script>
<script src="../js/shell.js"></script>
<script src="../js/main.js"></script>
<script src="../js/api.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const samples = [
      { t: 'The Quiet Algorithm', a: 'Lina Aldridge', g: 'Fiction',     c: 'from-violet-700 via-rose-600 to-amber-500' },
      { t: 'Deep Work for Tired Brains', a: 'Mateo Ruiz',  g: 'Non-fiction',c: 'from-cyan-600 via-violet-600 to-rose-500' },
      { t: 'A Garden of Equations', a: 'Aiko Tan',     g: 'Education',  c: 'from-emerald-600 via-cyan-500 to-violet-500' },
      { t: 'Letters from a Lost City', a: 'Soraya M.',  g: 'Memoir',     c: 'from-amber-600 via-rose-500 to-violet-700' },
      { t: 'How to Lead a Team of Misfits', a: 'P. Okafor', g: 'Business',   c: 'from-rose-600 via-amber-500 to-cyan-500' },
      { t: 'Field Notes from the Frontier', a: 'Iris Chen',g: 'Tech',      c: 'from-violet-600 via-cyan-500 to-emerald-500' },
      { t: 'Small Kindnesses, Daily', a: 'Ben Hadid',   g: 'Self-help',  c: 'from-amber-500 via-violet-600 to-rose-600' },
      { t: 'A Brief History of Almost Nothing', a: 'R. Engel', g: 'History',c: 'from-cyan-500 via-rose-600 to-amber-500' }
    ];
    const host = document.getElementById('wb-library');
    if (host) host.innerHTML = samples.map((b,i) => `
      <a href="demo.html" class="wb-book block group" data-wb-anim data-rv-delay="${i % 4}">
        <div class="wb-book-cover relative aspect-[3/4] bg-gradient-to-br ${b.c} p-5 text-white">
          <div class="absolute inset-0 wb-grid-bg opacity-30"></div>
          <div class="relative h-full flex flex-col">
            <span class="text-[10px] uppercase tracking-widest opacity-80">${b.g}</span>
            <h3 class="font-display font-black text-xl mt-auto leading-tight">${b.t}</h3>
            <p class="mt-2 text-xs text-white/85">by ${b.a}</p>
            <div class="mt-3 flex gap-1 text-[10px]">
              <span class="bg-white/20 rounded-full px-1.5 py-0.5">AI guide</span>
              <span class="bg-white/20 rounded-full px-1.5 py-0.5">Audio</span>
            </div>
          </div>
        </div>
        <p class="mt-3 text-sm font-semibold text-slate-900 dark:text-white group-hover:text-violet-600 dark:group-hover:text-violet-300">${b.t}</p>
        <p class="text-xs text-slate-500">${b.a} · ${b.g}</p>
      </a>
    `).join('');

    const wbIO = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); wbIO.unobserve(e.target); }}), { threshold:0.1 });
    host?.querySelectorAll('[data-wb-anim]').forEach(el => wbIO.observe(el));
    if (window.lucide) lucide.createIcons();
  });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contact — WebBook SaaS</title>
<meta name="description" content="Talk to a real human. Sales, support, partnerships." />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { darkMode:'class', theme:{ extend:{
    colors:{ violet:{500:'#8b5cf6',600:'#7c3aed'}, rose:{500:'#f43f5e'}, amber:{500:'#f59e0b'} },
    fontFamily:{ sans:['Inter','sans-serif'], display:['"Fraunces"','"Space Grotesk"','serif'] } }}}
</script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="../css/style.css">
</head>
<body data-prefix="../" class="bg-amber-50/30 dark:bg-[#0a0613] text-slate-800 dark:text-slate-200 antialiased font-sans">

<div data-shell></div>

<section class="pt-32 pb-16 relative overflow-hidden">
  <div class="absolute inset-0 wb-grid-bg"></div>
  <div class="wb-orb wb-orb-2 w-[420px] h-[420px] -top-20 -right-20"></div>

  <div class="relative max-w-5xl mx-auto px-4 sm:px-6 grid lg:grid-cols-[1.1fr_1fr] gap-10">
    <div data-rv>
      <span class="wb-chip">Contact</span>
      <h1 class="mt-4 font-display font-black text-4xl sm:text-5xl text-slate-900 dark:text-white">Talk to a <span class="wb-gradient-text">real human</span>.</h1>
      <p class="mt-5 text-slate-600 dark:text-slate-300">We answer within one business day. Tell us about your book, your readers, or your team.</p>

      <div class="mt-8 space-y-3">
        <a class="aside-action wb-glass rounded-xl p-4 flex items-center gap-3 wb-lift block" href="mailto:hello@webbook.app">
          <i data-lucide="mail" class="w-5 h-5 text-violet-500"></i>
          <div><p class="font-semibold text-slate-900 dark:text-white text-sm">hello@webbook.app</p><p class="text-xs text-slate-500">Authors & general questions</p></div>
        </a>
        <a class="aside-action wb-glass rounded-xl p-4 flex items-center gap-3 wb-lift block" href="mailto:sales@webbook.app">
          <i data-lucide="briefcase" class="w-5 h-5 text-rose-500"></i>
          <div><p class="font-semibold text-slate-900 dark:text-white text-sm">sales@webbook.app</p><p class="text-xs text-slate-500">Teams of 5+ · Education · Publishers</p></div>
        </a>
        <a class="aside-action wb-glass rounded-xl p-4 flex items-center gap-3 wb-lift block" href="mailto:press@webbook.app">
          <i data-lucide="megaphone" class="w-5 h-5 text-amber-500"></i>
          <div><p class="font-semibold text-slate-900 dark:text-white text-sm">press@webbook.app</p><p class="text-xs text-slate-500">Media & partnerships</p></div>
        </a>
      </div>
    </div>

    <form data-contact data-rv data-rv-delay="2" class="wb-glass rounded-2xl p-7 wb-gradient-border space-y-4">
      <h2 class="font-display font-bold text-xl text-slate-900 dark:text-white">Send a note</h2>
      <div>
        <label class="text-xs font-semibold uppercase tracking-wider text-slate-500">Name</label>
        <input name="name" required class="mt-1 w-full bg-white/60 dark:bg-white/5 border border-white/30 dark:border-white/10 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-violet-500" />
      </div>
      <div>
        <label class="text-xs font-semibold uppercase tracking-wider text-slate-500">Email</label>
        <input name="email" type="email" required class="mt-1 w-full bg-white/60 dark:bg-white/5 border border-white/30 dark:border-white/10 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-violet-500" />
      </div>
      <div>
        <label class="text-xs font-semibold uppercase tracking-wider text-slate-500">Subject</label>
        <input name="subject" class="mt-1 w-full bg-white/60 dark:bg-white/5 border border-white/30 dark:border-white/10 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-violet-500" />
      </div>
      <div>
        <label class="text-xs font-semibold uppercase tracking-wider text-slate-500">Message</label>
        <textarea name="message" rows="5" required class="mt-1 w-full bg-white/60 dark:bg-white/5 border border-white/30 dark:border-white/10 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-violet-500"></textarea>
      </div>
      <button type="submit" class="wb-btn-primary rounded-xl px-5 py-3 font-semibold w-full inline-flex items-center justify-center gap-2">Send <i data-lucide="send" class="w-4 h-4"></i></button>
      <p data-form-status class="text-sm"></p>
    </form>
  </div>
</section>

<div data-shell-foot></div>
<script src="../js/logos.js"></script>
<script src="../js/megamenu.js"></script>
<script src="../js/shell.js"></script>
<script src="../js/main.js"></script>
<script src="../js/api.js"></script>
</body>
</html>

<!DOCTYPE html>

<head>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<body data-prefix="../" class="bg-amber-50/30 dark:bg-[#0a0613] text-slate-800 dark:text-slate-200 antialiased font-sans">
<div data-shell></div>
<section class="pt-32 pb-12">
  <div class="max-w-6xl mx-auto px-4 sm:px-6" data-rv>

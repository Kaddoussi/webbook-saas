<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>All features — WebBook SaaS</title>
<meta name="description" content="Twelve capabilities every WebBook gets out of the box: AI companion, multilingual, narration, analytics, monetization, accessibility, and more." />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { darkMode:'class', theme:{ extend:{
    colors:{ violet:{500:'#8b5cf6',600:'#7c3aed'}, rose:{500:'#f43f5e'}, amber:{500:'#f59e0b'} },
    fontFamily:{ sans:['Inter','sans-serif'], display:['"Fraunces"','"Space Grotesk"','serif'] } }}}
</script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="../css/style.css">
</head>
<body data-prefix="../" class="bg-amber-50/30 dark:bg-[#0a0613] text-slate-800 dark:text-slate-200 antialiased font-sans">

<div data-shell></div>

<section class="pt-32 pb-12 relative overflow-hidden">
  <div class="absolute inset-0 wb-grid-bg"></div>
  <div class="wb-orb wb-orb-1 w-[420px] h-[420px] -top-20 -left-20"></div>
  <div class="wb-orb wb-orb-3 w-[360px] h-[360px] top-40 right-0"></div>
  <div class="relative max-w-4xl mx-auto px-4 sm:px-6 text-center" data-rv>
    <span class="wb-chip">All capabilities</span>
    <h1 class="mt-5 font-display font-black text-4xl sm:text-6xl text-slate-900 dark:text-white">Everything a book <span class="wb-gradient-text">wants to be</span>.</h1>
    <p class="mt-5 text-lg text-slate-600 dark:text-slate-300">Twelve capabilities, all included on the free plan. No hidden tier. No "AI add-on". Just a great book that breathes.</p>
  </div>
</section>

<section class="py-12">
  <div class="max-w-7xl mx-auto px-4 sm:px-6">
    <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6" id="wb-all-features"></div>
  </div>
</section>

<section class="py-20">
  <div class="max-w-4xl mx-auto px-4 sm:px-6 text-center" data-rv>
    <h2 class="font-display font-bold text-3xl text-slate-900 dark:text-white">All twelve. Every plan. <span class="wb-gradient-text">Free to start.</span></h2>
    <div class="mt-6 flex gap-3 justify-center flex-wrap">
      <a href="join.html" class="wb-btn-primary rounded-xl px-6 py-3 font-semibold inline-flex items-center gap-2">Start free <i data-lucide="arrow-right" class="w-4 h-4"></i></a>
      <a href="pricing.html" class="wb-btn-ghost rounded-xl px-6 py-3 font-semibold inline-flex items-center gap-2">See pricing</a>
    </div>
  </div>
</section>

<div data-shell-foot></div>
<script src="../js/logos.js"></script>
<script src="../js/megamenu.js"></script>
<script src="../js/shell.js"></script>
<script src="../js/main.js"></script>
<script src="../js/api.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => {
      const grid = document.getElementById('wb-all-features');
      if (!grid || !window.WBLogos) return;
      grid.innerHTML = window.WBLogos.FEATURES.map((f, i) => `
        <article id="${f.slug}" class="wb-glass rounded-2xl p-6 wb-lift" data-wb-anim data-rv-delay="${i % 3}">
          <span data-wb-icon="${f.slug}" data-size="64" class="block"></span>
          <h2 class="font-display font-bold text-xl mt-4 text-slate-900 dark:text-white">${f.name}</h2>
          <p class="mt-2 text-sm text-slate-600 dark:text-slate-300">${f.desc}</p>
          <a href="feature-${f.slug.split('-')[0]}.html" class="mt-4 inline-flex items-center gap-1 text-sm font-semibold text-violet-600 dark:text-violet-300 wb-link-underline">Learn more <i data-lucide="arrow-right" class="w-4 h-4"></i></a>
        </article>
      `).join('');
      window.WBLogos.renderAuto();
      const wbIO = new IntersectionObserver(entries => {
        entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); wbIO.unobserve(e.target); } });
      }, { threshold: 0.1 });
      grid.querySelectorAll('[data-wb-anim]').forEach(el => wbIO.observe(el));
      if (window.lucide) lucide.createIcons();
    }, 200);
  });
</script>
</body>
</html>

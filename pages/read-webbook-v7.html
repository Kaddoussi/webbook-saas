<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Read a WebBook · v7 Minimal — WebBook SaaS</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  :root{--rb-bg:#fafaf7;--rb-ink:#1a1625;--rb-line:rgba(0,0,0,.08);--rb-accent:#7c3aed}
  html.dark{color-scheme:dark}
  html,body{background:var(--rb-bg);color:var(--rb-ink);min-height:100vh;font-family:Inter,sans-serif}
  .v7-shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
  .v7-aside{position:fixed;top:0;bottom:0;left:0;width:240px;border-right:1px solid var(--rb-line);background:#fff;display:flex;flex-direction:column;z-index:30}
  .v7-main{margin-left:240px;display:flex;flex-direction:column;min-height:100vh;background:#fff}
  .v7-frame-wrap{flex:1;position:relative;background:#fff}
  .v7-frame{width:100%;height:100%;border:0;display:block}
  .v7-toc-item{display:block;padding:.5rem .75rem;border-radius:.4rem;font-size:.82rem;color:#5b5468;transition:all .2s}
  .v7-toc-item:hover{background:#f4f1ff;color:var(--rb-accent)}
  .v7-toc-item[aria-current="true"]{background:#f4f1ff;color:var(--rb-accent);font-weight:600;border-left:2px solid var(--rb-accent)}
  .v7-iconbtn{width:32px;height:32px;border-radius:.4rem;display:inline-flex;align-items:center;justify-content:center;color:#5b5468;transition:background .2s}
  .v7-iconbtn:hover{background:#f4f1ff;color:var(--rb-accent)}
  .v7-load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#fff;transition:opacity .4s}
  .v7-load.hide{opacity:0;pointer-events:none}
  .v7-spinner{width:36px;height:36px;border:3px solid #ede9fe;border-top-color:var(--rb-accent);border-radius:50%;animation:v7sp 1s linear infinite}
  @keyframes v7sp{to{transform:rotate(360deg)}}
  @media(max-width:900px){.v7-shell{grid-template-columns:1fr}.v7-aside{transform:translateX(-100%);transition:transform .3s}.v7-aside.is-open{transform:translateX(0)}.v7-main{margin-left:0}.v7-tog{display:inline-flex!important}}
  .v7-tog{display:none}
</style>
</head>
<body>
<button class="v7-tog v7-iconbtn fixed top-3 left-3 z-40 bg-white border border-gray-200 shadow-sm" id="v7Tog" aria-label="Menu"><i data-lucide="menu" class="w-4 h-4"></i></button>

<div class="v7-shell">
  <aside class="v7-aside" id="v7Aside">
    <div class="px-4 py-3.5 border-b" style="border-color:var(--rb-line)">
      <a href="../index.html" class="flex items-center gap-2">
        <span class="w-7 h-7 rounded-lg bg-gradient-to-br from-violet-600 to-rose-500 flex items-center justify-center"><i data-lucide="book-open" class="w-4 h-4 text-white"></i></span>
        <span class="font-semibold text-sm">WebBook<span class="block text-[9px] tracking-widest uppercase opacity-50">v7 Minimal</span></span>
      </a>
    </div>
    <div class="flex-1 overflow-y-auto px-3 py-3">
      <p class="text-[10px] uppercase tracking-widest text-gray-400 font-semibold px-2 mb-2">The Quiet Algorithm</p>
      <nav class="space-y-0.5">
        <a class="v7-toc-item" href="#c1">01. A whisper in the data</a>
        <a class="v7-toc-item" href="#c2">02. The garden of choices</a>
        <a class="v7-toc-item" href="#c3" aria-current="true">03. What the model would not say</a>
        <a class="v7-toc-item" href="#c4">04. Two algorithms</a>
        <a class="v7-toc-item" href="#c5">05. The interview</a>
        <a class="v7-toc-item" href="#c6">06. Echoes</a>
        <a class="v7-toc-item" href="#c7">07. Without windows</a>
        <a class="v7-toc-item" href="#c8">08. A child draws a map</a>
      </nav>
    </div>
    <div class="px-3 py-3 border-t flex items-center gap-1" style="border-color:var(--rb-line)">
      <button class="v7-iconbtn" title="Bookmark"><i data-lucide="bookmark" class="w-4 h-4"></i></button>
      <button class="v7-iconbtn" title="Listen"><i data-lucide="volume-2" class="w-4 h-4"></i></button>
      <button class="v7-iconbtn" title="Translate"><i data-lucide="languages" class="w-4 h-4"></i></button>
      <button class="v7-iconbtn ml-auto" title="Ask"><i data-lucide="sparkles" class="w-4 h-4"></i></button>
    </div>
  </aside>

  <main class="v7-main">
    <header class="flex items-center justify-between px-4 py-2.5 border-b" style="border-color:var(--rb-line)">
      <p class="text-xs text-gray-500">Chapter 03 of 12 · 24%</p>
      <div class="flex items-center gap-1">
        <a href="read-webbook.html" class="v7-iconbtn" title="v6 Default"><i data-lucide="layout" class="w-4 h-4"></i></a>
        <a href="read-webbook-v8.html" class="v7-iconbtn" title="v8"><i data-lucide="maximize-2" class="w-4 h-4"></i></a>
        <a href="read-webbook-v9.html" class="v7-iconbtn" title="v9"><i data-lucide="graduation-cap" class="w-4 h-4"></i></a>
        <a href="read-webbook-v10.html" class="v7-iconbtn" title="v10"><i data-lucide="film" class="w-4 h-4"></i></a>
        <a href="read-webbook-v11.html" class="v7-iconbtn" title="v11"><i data-lucide="target" class="w-4 h-4"></i></a>
      </div>
    </header>
    <div class="v7-frame-wrap" id="v7Wrap">
      <div class="v7-load" id="v7Load"><div class="v7-spinner"></div></div>
      <iframe class="v7-frame" id="v7Frame" src="https://2030b.com/webbook/webbook-v6.html" title="WebBook reader" loading="lazy" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
    </div>
  </main>
</div>
<script>
  lucide.createIcons();
  document.getElementById('v7Tog').addEventListener('click',()=>document.getElementById('v7Aside').classList.toggle('is-open'));
  const f=document.getElementById('v7Frame'),l=document.getElementById('v7Load');
  f.addEventListener('load',()=>setTimeout(()=>l.classList.add('hide'),200));setTimeout(()=>l.classList.add('hide'),4500);
  document.querySelectorAll('.v7-toc-item').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();document.querySelectorAll('.v7-toc-item').forEach(x=>x.removeAttribute('aria-current'));a.setAttribute('aria-current','true')}));
</script>
</body>
</html>
